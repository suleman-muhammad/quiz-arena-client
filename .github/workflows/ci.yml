name: Quiz Arena Client Application CI Pipeline

on:
    push:
        branches: [main, "test/*", "features/*", "refactor/*"]
    pull_request:
        branches: [main]

jobs:
    testing:
        name: Client Assests Build Check
        runs-on: ubuntu-latest
        steps:
          - name: Checkout Repository
            uses: actions/checkout@v4
        
          - name: Set Up Node.js 20
            uses: actions/setup-node@v4
            with:
                node-version: 20
                cache: 'npm'
                cache-dependency-path: package-lock.json

          - name: Install Dependencies
            run: npm ci
            
          - name: Verify Builds Cleanly
            run: npm run build


